<style>
/* DSE Paper 1 Trainer — mobile first, hand written CSS (no framework) */
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1d2430; --muted:#6b7280; --line:#e3e6ea;
  --a1:#1f77b4; --a2:#b8860b; --b:#8e44ad;
  --ok:#1a7f4b; --warn:#b45309; --bad:#c0392b; --primary:#1f6feb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
h1{font-size:1.25rem;margin:0 0 .75rem}
h2{font-size:1.05rem;margin:0 0 .5rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.hidden{display:none !important}

.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:.5rem;padding:.6rem .8rem;background:#fff;border-bottom:1px solid var(--line);
}
.brand{font-weight:700}
.topbar-right{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.badge{font-size:.8rem;color:var(--muted);max-width:9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

button{font:inherit;cursor:pointer;border-radius:.5rem;border:1px solid var(--line);background:#fff;padding:.5rem .7rem}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.ghost{background:#fff;color:var(--ink)}
button.small{padding:.3rem .55rem;font-size:.85rem}

main{padding:.8rem;max-width:960px;margin:0 auto}
.screen{animation:fade .15s ease-in}
@keyframes fade{from{opacity:.4}to{opacity:1}}

.card{background:var(--card);border:1px solid var(--line);border-radius:.75rem;padding:.8rem;margin:.8rem 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.tile{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:1rem .6rem;font-size:1.1rem;background:#fff}
.tile b{font-size:1.25rem}
.tile span{font-size:.8rem;color:var(--muted)}
.sec-a1{border-left:5px solid var(--a1)}
.sec-a2{border-left:5px solid var(--a2)}
.sec-b{border-left:5px solid var(--b)}

.input{width:100%;padding:.55rem;border:1px solid var(--line);border-radius:.5rem;background:#fff;font:inherit;margin:.25rem 0 .6rem}
.label{display:block;font-size:.9rem;color:var(--muted);margin-top:.5rem}

/* score entry */
.qcard{background:#fff;border:1px solid var(--line);border-radius:.75rem;padding:.7rem;margin:.6rem 0}
.qcard.a1{border-left:5px solid var(--a1)}
.qcard.a2{border-left:5px solid var(--a2)}
.qcard.b{border-left:5px solid var(--b)}
.qhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.4rem}
.qhead b{font-size:1.05rem}
.qsub{font-size:.9rem;color:var(--muted)}
.partrow{display:flex;align-items:center;gap:.5rem;padding:.35rem 0;border-top:1px dashed var(--line)}
.partrow:first-child{border-top:0}
.partlabel{flex:1;min-width:0}
.parttopic{display:block;font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:.3rem}
.stepper button{width:2.6rem;height:2.6rem;font-size:1.2rem;line-height:1;padding:0}
.stepper input{width:3.4rem;height:2.6rem;text-align:center;border:1px solid var(--line);border-radius:.5rem;font:inherit}
.stepper input.invalid{border-color:var(--bad);background:#fff5f4}
.stepper .max{color:var(--muted);font-size:.9rem;min-width:2rem}

.summarybar{
  position:sticky;bottom:0;z-index:15;display:flex;justify-content:space-between;align-items:center;
  gap:.5rem;padding:.6rem .8rem;background:#fff;border-top:1px solid var(--line);font-weight:600;
}
.actions{display:flex;gap:.5rem;margin:.8rem 0}
.actions .primary{flex:1}

.notice{background:#fff8e1;border:1px solid #f0d98a;border-radius:.5rem;padding:.6rem;margin:.6rem 0;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.error{background:#fff5f4;border:1px solid #f2c3bd;color:var(--bad);border-radius:.5rem;padding:.6rem;margin:.6rem 0}
.syncbar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.5rem .8rem;background:#fdf2e3;border-bottom:1px solid #f0d98a;font-size:.9rem}

/* report */
.bigscore{font-size:2rem;font-weight:700}
.bar{background:#eef1f4;border-radius:.35rem;height:.6rem;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--primary)}
.barrow{margin:.45rem 0}
.barrow .lab{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:.2rem}
.rate-ok{color:var(--ok)}
.rate-warn{color:var(--warn)}
.rate-bad{color:var(--bad);font-weight:600}
.chart{width:100%;height:260px}

.table{width:100%;border-collapse:collapse;font-size:.9rem}
.table th,.table td{padding:.45rem .5rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.table th{color:var(--muted);font-weight:600}
.table-scroll{overflow-x:auto}
.cellbtn{background:none;border:0;color:var(--primary);padding:0;text-decoration:underline}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;align-items:center}
.filters .primary{grid-column:span 2}

.loading{position:fixed;inset:0;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;z-index:40}
.spinner{width:2rem;height:2rem;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{padding:1rem .8rem 2rem;text-align:center}

@media (min-width:720px){
  h1{font-size:1.5rem}
  .grid{grid-template-columns:repeat(4,1fr)}
  .filters{grid-template-columns:repeat(4,1fr)}
  .filters .primary{grid-column:auto}
  .partrow{gap:1rem}
}
</style>
