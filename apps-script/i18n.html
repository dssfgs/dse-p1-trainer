var LANG_KEY = 'dsep1.lang.v1';
var LANG = (function () {
  try { return localStorage.getItem(LANG_KEY) || 'zh'; } catch (e) { return 'zh'; }
})();

function T(key, vars) {
  var dict = I18N[LANG] || I18N.zh;
  var s = dict[key] || (I18N.zh[key] || key);
  if (vars) {
    Object.keys(vars).forEach(function (k) {
      s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
    });
  }
  return s;
}

function applyI18n() {
  var nodes = document.querySelectorAll('[data-i18n]');
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].textContent = T(nodes[i].getAttribute('data-i18n'));
  }
  var btn = document.getElementById('btnLang');
  if (btn) btn.textContent = (LANG === 'zh') ? 'EN' : '中';
  document.documentElement.lang = (LANG === 'zh') ? 'zh-Hant' : 'en';
}

function setLang(lang) {
  LANG = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  applyI18n();
  if (window.onLangChanged) window.onLangChanged();
}

function topicName(t) {
  if (!t) return '';
  return LANG === 'zh' ? (t.nameZh || t.topicZh || t.zh || t.topicId)
                       : (t.nameEn || t.topicEn || t.en || t.topicId);
}
