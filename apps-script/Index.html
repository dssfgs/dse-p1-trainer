<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- NOTE: HtmlService ignores <meta> tags written here.
       The viewport tag is added in Code.gs doGet() via addMetaTag(). -->
  <?!= include('Styles'); ?>
</head>
<body>

<header class="topbar">
  <div class="brand" data-i18n="app.title">DSE 卷一訓練</div>
  <div class="topbar-right">
    <span id="userBadge" class="badge"></span>
    <button id="btnTeacher" class="ghost hidden" data-i18n="nav.teacher">班級總覽</button>
    <button id="btnHome" class="ghost" data-i18n="nav.home">首頁</button>
    <button id="btnLang" class="ghost">EN</button>
  </div>
</header>

<div id="syncBar" class="syncbar hidden">
  <span id="syncText"></span>
  <button id="btnRetryNow" class="small" data-i18n="sync.retryNow">立即重試</button>
</div>

<main id="app">

  <!-- fallback login: only shown when Session gives no email -->
  <section id="screen-login" class="screen hidden">
    <h1 data-i18n="login.title">選擇你的名字</h1>
    <p class="muted" data-i18n="login.hint">系統無法自動識別你的 Google 帳戶，請從名單中選擇。</p>
    <select id="studentPicker" class="input"></select>
    <button id="btnPickStudent" class="primary" data-i18n="login.confirm">確認</button>
  </section>

  <!-- year selection -->
  <section id="screen-year" class="screen hidden">
    <h1 data-i18n="year.title">選擇年份</h1>
    <div id="yearGrid" class="grid"></div>
    <div id="overviewWrap" class="card">
      <h2 data-i18n="year.overview">年份 × 部分總覽</h2>
      <div class="table-scroll"><table id="overviewTable" class="table"></table></div>
      <p class="muted small" data-i18n="year.overviewHint">每格顯示：最新分 / 最高分（次數）</p>
    </div>
  </section>

  <!-- section selection -->
  <section id="screen-section" class="screen hidden">
    <h1><span id="secTitleYear"></span> <span data-i18n="section.title">選擇部分</span></h1>
    <div class="grid">
      <button class="tile sec-a1" data-section="A1"><b>A(1)</b><span>35</span></button>
      <button class="tile sec-a2" data-section="A2"><b>A(2)</b><span>35</span></button>
      <button class="tile sec-b" data-section="B"><b>B</b><span>35</span></button>
    </div>
    <p class="muted" data-i18n="section.hint">先用紙本或官方試卷作答，再回來逐小題輸入分數。</p>
  </section>

  <!-- score entry -->
  <section id="screen-quiz" class="screen hidden">
    <div class="quizhead">
      <h1 id="quizTitle"></h1>
      <a id="paperLink" class="ghost hidden" target="_blank" data-i18n="quiz.openPaper">開啟試卷</a>
    </div>
    <div id="draftNotice" class="notice hidden">
      <span data-i18n="quiz.draftFound">找到未完成的草稿。</span>
      <button id="btnResumeDraft" class="small" data-i18n="quiz.resume">繼續</button>
      <button id="btnDiscardDraft" class="small ghost" data-i18n="quiz.discard">丟棄</button>
    </div>
    <div id="questionList"></div>
    <label class="label" data-i18n="quiz.note">備註（錯因、時間感覺等）</label>
    <textarea id="attemptNote" class="input" rows="2"></textarea>
    <div class="actions">
      <button id="btnFillZero" class="ghost" data-i18n="quiz.fillZero">空白填 0</button>
      <button id="btnSubmit" class="primary" data-i18n="quiz.submit">提交</button>
    </div>
    <div id="quizError" class="error hidden"></div>
  </section>

  <!-- report -->
  <section id="screen-report" class="screen hidden">
    <h1 data-i18n="report.title">成績報告</h1>
    <div id="resultCard" class="card"></div>
    <div class="card">
      <h2 data-i18n="report.trend">歷次趨勢</h2>
      <div id="trendChart" class="chart"></div>
    </div>
    <div class="card">
      <h2 data-i18n="report.byQuestion">各題得分</h2>
      <div id="questionBars"></div>
    </div>
    <div class="card">
      <h2 data-i18n="report.weakTopics">弱項課題</h2>
      <div id="topicList"></div>
      <p class="muted small" id="topicHint"></p>
    </div>
    <div class="card">
      <h2 data-i18n="report.strand">三大範疇</h2>
      <div id="strandList"></div>
    </div>
    <div class="card">
      <h2 data-i18n="report.recent">最近 10 次</h2>
      <div class="table-scroll"><table id="recentTable" class="table"></table></div>
    </div>
  </section>

  <!-- teacher overview -->
  <section id="screen-teacher" class="screen hidden">
    <h1 data-i18n="teacher.title">班級總覽</h1>
    <div class="filters">
      <select id="fKlass" class="input"></select>
      <select id="fYear" class="input"></select>
      <select id="fSection" class="input"></select>
      <button id="btnApplyFilter" class="primary" data-i18n="teacher.apply">套用</button>
    </div>
    <div id="classSummary" class="card"></div>
    <div class="card">
      <h2 data-i18n="teacher.weakest">全班最弱 5 個課題</h2>
      <div id="classWeak"></div>
    </div>
    <div class="card">
      <h2 data-i18n="teacher.students">學生</h2>
      <div class="table-scroll"><table id="studentTable" class="table"></table></div>
    </div>
  </section>

  <div id="loading" class="loading hidden"><div class="spinner"></div></div>
</main>

<footer class="foot">
  <span class="muted small" data-i18n="foot.note">本站不存放試題內容；試題版權屬 HKEAA。</span>
</footer>

<?!= include('i18n'); ?>
<?!= include('JavaScript'); ?>
</body>
</html>
